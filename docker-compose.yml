services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: trevviq:local
    container_name: trevviq_app_local
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: trevviq
      DB_USERNAME: trevviq
      DB_PASSWORD: secret
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      TREVVIQ_SEED_DEMO: "true"
      TREVVIQ_DEMO_LOGIN: "true"
    volumes:
      - trevviq_storage:/var/www/html/storage
      - trevviq_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: trevviq_mysql_local
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: trevviq
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: trevviq
      MYSQL_PASSWORD: secret
    ports:
      - "3308:3306"
    volumes:
      - trevviq_mysql_local:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: trevviq_mailpit_local
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1026:1025"

volumes:
  trevviq_mysql_local:
  trevviq_storage:
  trevviq_bootstrap_cache:
