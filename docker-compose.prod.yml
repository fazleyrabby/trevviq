services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: trevviq:latest
    container_name: trevviq_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Direct host access (in addition to Traefik). Set TREVVIQ_PORT in .env.
      - "${TREVVIQ_PORT:-8090}:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.trevviq.rule=Host(`${APP_HOST:-trevviq.example.com}`)"
      - "traefik.http.routers.trevviq.entrypoints=web"
      - "traefik.http.services.trevviq.loadbalancer.server.port=80"
      - "traefik.http.middlewares.trevviq-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.trevviq-headers.headers.customrequestheaders.X-Forwarded-Port=443"
      - "traefik.http.routers.trevviq.middlewares=trevviq-headers"
    volumes:
      - trevviq_storage:/var/www/html/storage
      - trevviq_bootstrap_cache:/var/www/html/bootstrap/cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s
    networks:
      - traefik
      - trevviq
      - mysql-shared

  # Dedicated Mailpit instance for this app (captures all outgoing mail).
  mailpit:
    image: axllent/mailpit:latest
    container_name: trevviq_mailpit
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - trevviq_mailpit_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.trevviq-mail.rule=Host(`${MAIL_HOST:-mail.trevviq.example.com}`)"
      - "traefik.http.routers.trevviq-mail.entrypoints=web"
      - "traefik.http.services.trevviq-mail.loadbalancer.server.port=8025"
    networks:
      - traefik
      - trevviq

volumes:
  trevviq_storage:
  trevviq_bootstrap_cache:
  trevviq_mailpit_data:

networks:
  traefik:
    external: true
  mysql-shared:
    external: true
  trevviq:
    driver: bridge
