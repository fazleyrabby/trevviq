server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/html/public;

    index index.php index.html;

    charset utf-8;

    # Security headers are set by the application (SecurityHeaders middleware)
    # so they also apply on cPanel/Apache where nginx is not present.

    # Logging
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Max upload size (matches the 100 MB video limit in the spec)
    client_max_body_size 100M;

    # Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
    }

    # Hashed Vite bundle — safe to cache forever
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Stable vendor assets (Tabler, etc.)
    location ^~ /tabler/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Unhashed brand / facility photos — revalidate so replacements propagate
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    location ~* \.(?:ico|woff2?|ttf|eot|svg|png|jpe?g|webp|gif)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Deny hidden + sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ /\.(env|git|htaccess|htpasswd|ini|log|sh|sql|conf|bak)$ {
        deny all;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;
}
