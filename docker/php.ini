; PHP configuration for the application container

memory_limit = 256M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 300
max_input_time = 300
max_input_vars = 3000

; Temp dirs (writable, inside the app storage)
sys_temp_dir = /var/www/html/storage/tmp
upload_tmp_dir = /var/www/html/storage/tmp

; OPcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; Realpath cache
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Errors
display_errors = Off
log_errors = On
error_log = /var/log/nginx/php_errors.log
